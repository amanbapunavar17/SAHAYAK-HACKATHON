[project]
name = "sahayak-backend"
version = "1.0.0"
description = "SAHAYAK Intelligent Campus Lost & Found Backend"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.28.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "email-validator>=2.0.0",
  "sqlalchemy>=2.0.28",
  "alembic>=1.13.1",
  "pyjwt>=2.8.0",
  "bcrypt>=4.1.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "python-dotenv>=1.0.1",
  "pillow>=10.2.0"
]

[tool.vercel]
entrypoint = "backend.app.main:app"
